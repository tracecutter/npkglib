[project]
name = "npkglib"
version = "1.1.0"
description = "Reusable utility toolbox for npkg-based projects"
authors = [
  { name = "John Fogelin" }
]
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
requires-python = ">=3.11"

classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Topic :: Utilities"
]

dependencies = [
    "tomlkit>=0.14.0",
]

[project.optional-dependencies]
dev = [
    # configuration
	"npkg-pfig>=2.0.0",

    # docs
	"npkg-psym>=0.1.0",
    "sphinx<9.0,>=8.2.3",
    "myst-parser<5.0.0",
    "furo>=2025.12.19",

    # test
    "pytest>=9.0.2",

    # lint/style
    "ruff>=0.15.5",
    "black<26.0,>=25.12.0",

    # typing
    "mypy>=1.19.1",

    # distribution
    "build>=1.4.0",
    "twine>=6.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["npkglib*"]

[tool.setuptools.package-data]
npkglib = [
    "_assets/**/*",
    "_assets/**/.*",
]

[tool.ruff]
target-version = "py311"
lint.select = ["E", "F", "W", "B", "UP"]
lint.ignore = ["E501"]

[tool.black]
line-length = 120 
target-version = ["py311"]
skip-string-normalization = true

[tool.mypy]
disable_error_code = ["annotation-unchecked"]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = false
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.npkg]
role = "package"
type = "in-situ"

[tool.psym]
docs-dir = "docs"

sysdeps = [
  "git>=2.0",
  "make>=4.0"
]
